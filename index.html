    <!-- Balón: dibujo propio (no hay balón en el conjunto que integré) -->
    <symbol id="i-ball" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 7V2.5M16 10l4.5-1.5M14.5 14.5l3 4M9.5 14.5l-3 4M8 10L3.5 8.5"/></g></symbol>

  <a class="salto" href="#contenido">Saltar al contenido</a>

  <div class="app">
    <header class="topbar">
      <div class="marca">
        <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-ball"/></svg>
        <div>
          <h1>DATA FÚTBOL</h1>
          <p class="sub">Liga Colombiana · Categoría Primera A</p>
        </div>
      </div>
      <div class="controles">
        <button type="button" id="tema" aria-pressed="false">
          <svg class="ico i-luna" aria-hidden="true" focusable="false"><use href="#i-luna"/></svg>
          <svg class="ico i-sol" aria-hidden="true" focusable="false"><use href="#i-sol"/></svg>
          <span class="tx-luna">Modo oscuro</span><span class="tx-sol">Modo claro</span>
        </button>
      </div>
    </header>

    <nav class="menu" aria-label="Secciones">
      <button type="button" data-vista="panel"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-home"/></svg><span class="t-lg">Panel principal</span><span class="t-cr">Panel</span></button>
      <button type="button" data-vista="jugadores"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-person"/></svg><span>Jugadores</span></button>
      <button type="button" data-vista="equipos"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-shield"/></svg><span>Equipos</span></button>
      <button type="button" data-vista="liga"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-trophy"/></svg><span class="t-lg">Liga BetPlay</span><span class="t-cr">Liga</span></button>
      <button type="button" data-vista="predicciones"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-trending"/></svg><span class="t-lg">Predicciones</span><span class="t-cr">Predicción</span></button>
    </nav>

    <div class="cuerpo">
      <div class="filtro">
        <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-filter"/></svg>
        <label for="filtro-equipo">Ver información de:</label>
        <select id="filtro-equipo"></select>
        <span id="estado" class="estado" role="status"></span>
        <button type="button" id="refrescar" class="sec"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-refresh"/></svg>Actualizar</button>
      </div>
      <main id="contenido" tabindex="-1" aria-live="polite"></main>
      <footer class="pie">Fuente: base de datos propia (alimentada desde ESPN) o ESPN directo. Sin conexión se usan los últimos datos guardados o datos de ejemplo.</footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
